<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1013" />
    <meta name="description" content="A screening map of where Central Kalimantan peatland dried over the dry season, seen by the NISAR L-band radar." />

      <header id="bar">

    <script type="module" src="/src/main.ts"></script>
